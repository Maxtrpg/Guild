<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>任務日誌 | MAZTICA AVG System</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@300;400;600&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --font-title: 'Cinzel', 'Noto Sans TC', serif;
            --font-body: 'Inter', 'Noto Sans TC', sans-serif;
            
            /* Maztica AVG Palette */
            --avg-bg: rgba(10, 8, 6, 0.85);
            --avg-gold: #d4af37;
            --avg-jade: #00a86b;
            --avg-blood: #a30000;
            --avg-dark: #121212;
            --avg-glow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        body { 
            margin: 0; padding: 20px; 
            font-family: var(--font-body); 
            background: transparent;
            color: #e0e0e0;
            overflow-x: hidden;
        }
        
        * { box-sizing: border-box; }

        /* AVG 系統分頁標籤 */
        .avg-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        .avg-tab-btn {
            background: rgba(0,0,0,0.6);
            border: 1px solid #444;
            color: #888;
            padding: 10px 25px;
            font-family: var(--font-title);
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
            transition: all 0.3s ease;
        }
        .avg-tab-btn:hover {
            color: #fff;
            border-color: var(--avg-gold);
            box-shadow: var(--avg-glow);
        }
        .avg-tab-btn.active {
            background: linear-gradient(135deg, #1a1510 0%, #2c1e14 100%);
            border: 1px solid var(--avg-gold);
            color: var(--avg-gold);
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
            box-shadow: var(--avg-glow);
        }

        /* 標題與簡介區塊 */
        .category-header {
            margin-bottom: 25px;
            padding: 20px 25px;
            background: linear-gradient(90deg, rgba(20, 16, 12, 0.8) 0%, transparent 100%);
            border-left: 4px solid var(--avg-gold);
            animation: slideInLeft 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .category-title {
            font-family: var(--font-title);
            font-size: 1.8rem;
            color: #fff;
            margin: 0 0 10px 0;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }
        .category-desc {
            font-size: 0.95rem;
            color: #bbb;
            line-height: 1.7;
            margin: 0;
            max-width: 850px;
        }

        /* 高亮備註欄樣式 */
        .highlight-note {
            background: rgba(212, 175, 55, 0.1);
            border-left: 3px solid var(--avg-gold);
            padding: 10px 15px;
            margin-top: 12px;
            font-size: 0.9rem;
            color: #ffda75;
            border-radius: 0 4px 4px 0;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            line-height: 1.5;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .highlight-note i { margin-top: 3px; color: var(--avg-gold); }

        /* 輪轉控制區塊 */
        .slider-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }
        .slider-btn {
            background: rgba(0,0,0,0.8);
            border: 1px solid #444;
            color: var(--avg-gold);
            width: 45px; height: 45px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
            z-index: 10;
        }
        .slider-btn:hover {
            background: var(--avg-gold);
            color: #000;
            border-color: #fff;
            box-shadow: var(--avg-glow);
            transform: scale(1.1);
        }

        /* 橫向輪轉滑動容器 */
        .quest-slider-container {
            width: 100%;
            overflow-x: hidden; /* 隱藏原生卷軸改用按鈕 */
            display: flex;
            gap: 20px;
            padding: 15px 5px 30px 5px;
            scroll-behavior: smooth;
        }

        /* AVG 長條狀任務卡片 (精準計算：一次顯示三張) */
        .avg-quest-card {
            flex: 0 0 calc((100% - 40px) / 3);
            height: 420px;
            background: var(--avg-dark);
            border: 1px solid #333;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            animation: fadeInCard 0.5s ease backwards;
        }
        @media (max-width: 900px) { .avg-quest-card { flex: 0 0 calc((100% - 20px) / 2); } }
        @media (max-width: 650px) { .avg-quest-card { flex: 0 0 100%; } }
        
        .avg-quest-card:nth-child(1) { animation-delay: 0.1s; }
        .avg-quest-card:nth-child(2) { animation-delay: 0.2s; }
        .avg-quest-card:nth-child(3) { animation-delay: 0.3s; }
        .avg-quest-card:nth-child(4) { animation-delay: 0.4s; }

        /* 背景圖片與AVG漸層遮罩 */
        .card-bg-img {
            width: 100%; height: 60%;
            background-size: cover; background-position: center;
            transition: transform 0.5s ease;
            filter: grayscale(20%) brightness(0.8);
        }
        .avg-quest-card::after {
            content: '';
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 30%, rgba(18,18,18,0.95) 60%, var(--avg-dark) 100%);
            z-index: 1;
        }

        .avg-quest-card:hover {
            transform: translateY(-8px);
            border-color: var(--avg-gold);
            box-shadow: 0 15px 30px rgba(212,175,55,0.2), var(--avg-glow);
        }
        .avg-quest-card:hover .card-bg-img {
            transform: scale(1.05);
            filter: grayscale(0%) brightness(1);
        }

        /* 卡片文字內容 */
        .card-info {
            position: absolute; bottom: 0; left: 0; width: 100%;
            padding: 20px; z-index: 2;
        }
        .quest-meta {
            font-size: 0.85rem; font-family: var(--font-title); letter-spacing: 1px; margin-bottom: 5px;
            display: flex; justify-content: space-between; align-items: center;
        }
        
        /* 標籤配色 */
        .type-main { color: var(--avg-gold); text-shadow: 0 0 5px rgba(212,175,55,0.5); }
        .type-side { color: #b0bec5; }
        .type-event { color: #b388ff; text-shadow: 0 0 5px rgba(179,136,255,0.5); }
        
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .camp-one { color: var(--avg-jade); } /* 單次 */
        .camp-short { color: #4fc3f7; } /* 短團 */
        .camp-long { color: var(--avg-blood); } /* 長團 */
        .camp-one .status-dot { background: var(--avg-jade); box-shadow: 0 0 5px var(--avg-jade); }
        .camp-short .status-dot { background: #4fc3f7; box-shadow: 0 0 5px #4fc3f7; }
        .camp-long .status-dot { background: var(--avg-blood); box-shadow: 0 0 5px var(--avg-blood); }

        .quest-title {
            font-family: var(--font-title); font-size: 1.4rem; font-weight: 700; margin: 0 0 8px 0;
            color: #fff; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;
        }
        .quest-intro {
            font-size: 0.88rem; color: #aaa; line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            margin-bottom: 12px; height: 2.64em;
        }
        .click-prompt {
            font-size: 0.75rem; color: var(--avg-gold); font-family: var(--font-title);
            text-align: right; opacity: 0.6; transition: opacity 0.3s;
        }
        .avg-quest-card:hover .click-prompt { opacity: 1; animation: flash 1.5s infinite; }

        /* AVG 事件對話盒 (詳細介紹彈窗) */
        .avg-dialogue-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none; justify-content: center; align-items: center;
            z-index: 9999; padding: 40px;
            backdrop-filter: blur(8px);
            animation: fadeIn 0.3s forwards;
        }
        .avg-dialogue-overlay.open { display: flex; }
        
        .avg-dialogue-box {
            width: 100%; max-width: 900px;
            background: rgba(20, 16, 12, 0.95);
            border: 2px solid var(--avg-gold);
            box-shadow: var(--avg-glow), inset 0 0 30px rgba(0,0,0,0.8);
            border-radius: 4px;
            position: relative;
            padding: 30px;
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 30px;
            animation: slideUp 0.4s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }
        @media (max-width: 760px) {
            .avg-dialogue-box { grid-template-columns: 1fr; padding: 20px; }
            .dialogue-illustration { display: none; }
        }

        .dialogue-illustration {
            width: 100%; height: 100%; min-height: 250px;
            border: 1px solid #444; background-size: cover; background-position: center;
            border-radius: 2px; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .dialogue-content { display: flex; flex-direction: column; justify-content: space-between; }
        .dialogue-header {
            border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 15px;
            display: flex; justify-content: space-between; align-items: flex-start;
        }
        .dialogue-title { font-family: var(--font-title); font-size: 1.8rem; color: #fff; margin: 0; }
        .dialogue-tag {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color); padding: 4px 12px; font-size: 0.9rem;
            font-family: var(--font-title); border-radius: 4px;
            white-space: nowrap; margin-left: 15px; font-weight: bold;
        }

        .dialogue-text {
            font-size: 1.05rem; line-height: 1.7; color: #ddd;
            white-space: pre-wrap; margin-bottom: 20px;
            max-height: 250px; overflow-y: auto; padding-right: 5px;
        }
        .dialogue-text::-webkit-scrollbar { width: 4px; }
        .dialogue-text::-webkit-scrollbar-thumb { background: #555; border-radius: 2px; }

        .dialogue-footer {
            border-top: 1px dashed #444; padding-top: 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .dialogue-reward { font-family: var(--font-title); font-size: 1.1rem; color: #ffb74d; }
        .dialogue-close-btn {
            background: transparent; border: 1px solid #666; color: #aaa;
            padding: 8px 20px; cursor: pointer; font-family: var(--font-title);
            transition: all 0.2s; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
        }
        .dialogue-close-btn:hover { background: #fff; color: #000; border-color: #fff; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideInLeft { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeInCard { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes flash { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="avg-tabs">
        <button class="avg-tab-btn active" onclick="switchCategory('reenactment')">
            <i class="fas fa-history" style="margin-right:8px;"></i>紀錄重現
        </button>
        <button class="avg-tab-btn" onclick="switchCategory('permanent')">
            <i class="fas fa-scroll" style="margin-right:8px;"></i>常駐任務
        </button>
    </div>

    <div class="category-header" id="cat-header">
        <h2 class="category-title" id="cat-title">紀錄重現</h2>
        <div class="category-desc" id="cat-desc">
            冒險者們回報的所有任務紀錄都被保存在公會檔案中。透過公會特殊的魔法物品，冒險者可以將意識投射至根據紀錄所模擬的幻境之中，體驗那些已封存的冒險故事。
            <div class="highlight-note"><i class="fas fa-exclamation-triangle"></i> 透過魔法重現，幻境結束後無法獲得任何實際戰利品，然而從中學習的經驗才最可貴。</div>
            <div class="highlight-note"><i class="fas fa-brain"></i> 在幻境中死亡不會影響現實，但會對精神造成無法抹滅的影響；相對而言，每次完成幻境也是一種對精神力的磨練。</div>
        </div>
    </div>
    
    <!-- 橫向滑動區塊含左右按鈕 -->
    <div class="slider-wrapper">
        <button class="slider-btn" onclick="slideQuests(-1)"><i class="fas fa-chevron-left"></i></button>
        <div class="quest-slider-container" id="quest-slider">
            <!-- 任務卡片會經由 JS 自動生成 -->
        </div>
        <button class="slider-btn" onclick="slideQuests(1)"><i class="fas fa-chevron-right"></i></button>
    </div>

    <!-- AVG 劇本型詳細介紹對話盒 -->
    <div id="avg-dialogue" class="avg-dialogue-overlay" onclick="closeDialogue(event)">
        <div class="avg-dialogue-box">
            <div class="dialogue-illustration" id="dlg-img"></div>
            <div class="dialogue-content">
                <div>
                    <div class="dialogue-header">
                        <h2 class="dialogue-title" id="dlg-title">任務標題</h2>
                        <span class="dialogue-tag" id="dlg-status">狀態</span>
                    </div>
                    <div class="dialogue-text" id="dlg-text">詳細任務敘述...</div>
                </div>
                <div class="dialogue-footer">
                    <div class="dialogue-reward"><i class="fas fa-trophy" style="margin-right:8px;"></i>報酬：<span id="dlg-reward">-</span></div>
                    <button class="dialogue-close-btn" onclick="document.getElementById('avg-dialogue').classList.remove('open')">返回</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CATEGORY_INFO = {
            reenactment: {
                title: "紀錄重現",
                desc: `冒險者們回報的所有任務紀錄都被保存在公會書庫中。透過公會特殊的魔法物品，冒險者可以將意識投射至根據紀錄所模擬的幻境之中，體驗那些已封存的冒險故事。
                       <div class="highlight-note"><i class="fas fa-exclamation-triangle"></i> 透過魔法重現，幻境結束後無法獲得任何實際戰利品，然而從中學習的經驗才最可貴。</div>
                       <div class="highlight-note"><i class="fas fa-brain"></i> 在幻境中死亡不會影響現實，但會對精神造成無法抹滅的影響；相對而言，每次完成幻境也是一種對精神力的磨練。</div>`
            },
            permanent: {
                title: "常駐任務",
                desc: ``
            }
        };

                    desc: "\n遠帕伊特，納拉巴頓叢林北部的特拉科亞村，世代流傳著一個可怕的傳說：\n「每逢『血影夜』，邪靈的爪牙將自沼澤深處爬出，奪走生者的氣息。」\n\n今年的血影夜前夕，村民們夜裡不詳的夢境似乎預示著即將到來的危機。\n\n絕望的特拉科亞人只剩最後的希望——前往佩澤拉克尋求外來者的幫助。\n\n在災難降臨前，你們能否阻止這場災禍，並查明背後的真相？",

                {

        // 輪轉控制函數 (修正版)
function slideQuests(direction) {
    const container = document.getElementById('quest-slider');
    const card = container.querySelector('.avg-quest-card');
    
    if (!card) return;
    
    // 動態獲取單張卡片的實際寬度，並加上 gap 的 20px
    const scrollAmount = card.offsetWidth + 20; 
    
    // 依據按鈕方向精準捲動一張卡片的距離
    container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
}

        // 判斷類型與團務的 CSS class
        function getTypeClass(type) {
            if(type === '主線') return 'type-main';
            if(type === '支線') return 'type-side';
            return 'type-event';
        }

        function getCampClass(camp) {
            if(camp === '單次') return 'camp-one';
            if(camp === '短團') return 'camp-short';
            return 'camp-long';
        }

        function renderQuests() {
            const container = document.getElementById('quest-slider');
            const data = QUEST_DATABASE[currentCategory];
            const info = CATEGORY_INFO[currentCategory];

            const headerObj = document.getElementById('cat-header');
            headerObj.style.animation = 'none';
            headerObj.offsetHeight; 
            headerObj.style.animation = 'slideInLeft 0.4s cubic-bezier(0.165, 0.84, 0.44, 1)';
            
            document.getElementById('cat-title').innerText = info.title;
            document.getElementById('cat-desc').innerHTML = info.desc;

            if (!data || data.length === 0) {
                container.innerHTML = '<div style="color:#666; padding:20px;">當前分類下暫無任何任務紀事。</div>';
            } else {
                container.innerHTML = data.map((q, idx) => {
                    return `
                        <div class="avg-quest-card" onclick="openQuestDetail('${currentCategory}', ${idx})">
                            <div class="card-bg-img" style="background-image: url('${q.image}');"></div>
                            <div class="card-info">
                                <div class="quest-meta">
                                    <span class="${getTypeClass(q.type)}"><i class="fas fa-bookmark" style="margin-right:4px;"></i>${q.type}</span>
                                    <span class="${getCampClass(q.campaignType)}"><span class="status-dot"></span>${q.campaignType}</span>
                                </div>
                                <h3 class="quest-title">${q.title}</h3>
                                <div class="quest-intro">${q.intro}</div>
                                <div class="click-prompt">▼ 點擊查閱</div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            container.scrollLeft = 0; // 切換分類時回到最左側
            setTimeout(() => { if(window.parent) window.parent.postMessage('resize-quests', '*'); }, 150);
        }

        function switchCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.avg-tab-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            renderQuests();
        }

        function openQuestDetail(cat, idx) {
            const quest = QUEST_DATABASE[cat][idx];
            if(!quest) return;

            document.getElementById('dlg-img').style.backgroundImage = `url('${quest.image}')`;
            document.getElementById('dlg-title').innerText = quest.title;
            
            const tagObj = document.getElementById('dlg-status');
            tagObj.innerHTML = `<span class="${getTypeClass(quest.type)}">${quest.type}</span> | <span class="${getCampClass(quest.campaignType)}">${quest.campaignType}</span>`;
            
            document.getElementById('dlg-text').innerText = quest.desc;
            document.getElementById('dlg-reward').innerText = quest.reward;

            document.getElementById('avg-dialogue').classList.add('open');
        }

        function closeDialogue(e) {
            if (e.target === e.currentTarget) {
                document.getElementById('avg-dialogue').classList.remove('open');
            }
        }

        window.onload = renderQuests;
    </script>
